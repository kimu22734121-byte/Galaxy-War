<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261124-2202">
</head>
<body>
<div class="shell title" id="shell">
  <header>
    <div class="mark">GALAXY <span>WAR</span></div>
    <div class="btns"><button class="tog" id="sndTog" aria-pressed="true">サウンド ON</button><button class="tog" id="bgmTog" aria-pressed="true">BGM ON</button><button class="tog" id="animTog" aria-pressed="true">戦闘アニメ ON</button><button class="tog" id="fsTog" aria-pressed="false">全画面</button><button class="tog" id="pTog" aria-pressed="true">パネル ▼</button></div>
  </header>
  <div id="titleView"></div>
  <div class="mapbar"><div class="status" id="status"></div><div class="zoom"><button class="tog" id="zOut" aria-label="縮小">－</button><span id="zLbl"></span><button class="tog" id="zIn" aria-label="拡大">＋</button></div></div>
  <div class="mapwrap" id="mapwrap">
    <div class="mapscroll" id="mapscroll"><div class="mapinner" id="mapinner"><canvas id="map"></canvas><div class="cmd" id="cmd" hidden></div></div></div>
    <div class="banner" id="banner" hidden></div>
    <div class="battle" id="battle" hidden>
      <div class="bhud"><div class="l"><div class="row"><span id="bnA">青軍</span><span id="bhA"></span></div><div class="bar"><i id="bbA"></i></div><div class="bt" id="btA"></div></div><div class="r"><div class="row"><span id="bnB">赤軍</span><span id="bhB"></span></div><div class="bar"><i id="bbB"></i></div><div class="bt" id="btB" style="text-align:right"></div></div></div>
      <div class="bskip">タップでスキップ</div>
    </div>
  </div>
  <section class="deck" id="panel"></section>
  <div class="legend">
    <span><i style="background:#1d2150;border:1px solid #6b6f9a"></i>小惑星帯 防御+</span>
    <span><i style="background:#5a2a7a"></i>星雲 回避+</span>
    <span><i style="background:#05061a;border:1px solid #7a62d6"></i>ブラックホール 通行不可</span>
    <span><i style="background:rgba(255,106,77,.35);border:1px solid #ff6a4d"></i>攻撃が届く範囲</span><span><i style="background:#2b3070;border:1px solid #7f84b8"></i>「済」行動済み</span><span>◎ ステーション 収入</span><span>■ 工廠 生産</span><span>★ 本拠地</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js?v=20261124-2202"></script>
</body>
</html>
